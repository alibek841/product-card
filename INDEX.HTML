<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <h1 class="page__title">Выбери свой продукт</h1>
    <div class="buttons">
      <button id="change_color_btn_card">изменить цвет карточки</button>
      <button id="change_colors_btn_cards_all">изменить цвет всех карточек</button>
      <button id="open_Google">открыть Google</button>
      <button id="output_console_log">вывод консоль лог</button>
      <button id="changeButtonColor">Изменить цвет кнопки</button>
    </div>
    <ul class="cards" id="cards"></ul>

    <template id="card-template">
      <li class="cards__item">
        <article class="card">
          <img class="card__image" src="" alt="" width="290">
          <span class="card__category"></span>
          <h2 class="card__title"></h2>
          <p class="card__description"></p>
          <span class="card__subtitle">Состав:</span>
          <ul class="card__compound_list"></ul>
          <div class="card__price_row">
            <span class="card__price_label">Цена</span>
            <span class="card__price_value"></span>
          </div>
        </article>
      </li>
    </template>
  </main>

  <footer class="footer">
  <div class="footer__container">

  <div class="footer__info">
    <h2 class="footer__title">Product Cards</h2>

    <p class="footer__description">
      У Нас Самые Лучшие Продукты Для Кожи!
    </p>

    <div class="footer__social">
      <a
        href="https://t.me"
        target="_blank"
        rel="noopener"
        class="icon-item"
        aria-label="Telegram"
      >
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M21.5 3.5 18.2 20c-.25 1.15-.9 1.43-1.83.9l-5.05-3.72-2.44 2.35c-.27.27-.5.5-1.02.5l.37-5.15 9.38-8.47c.41-.37-.09-.58-.64-.21L5.37 13.48.42 11.93c-1.08-.34-1.1-1.08.23-1.6L20.01 2.8c.9-.33 1.69.21 1.49.7Z"/>
        </svg>
      </a>

      <a
        href="https://vk.com"
        target="_blank"
        rel="noopener"
        class="icon-item"
        aria-label="ВКонтакте"
      >
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M15.93 2H8.07C4.72 2 2 4.72 2 8.07v7.86C2 19.28 4.72 22 8.07 22h7.86c3.35 0 6.07-2.72 6.07-6.07V8.07C22 4.72 19.28 2 15.93 2zm3.1 11.53c.12.28.08.5-.3.5h-1.26c-.32 0-.47-.17-.55-.36-.2-.48-.68-1.5-1.1-1.84-.14-.11-.2-.15-.3-.15-.14 0-.18.04-.24.12-.13.16-.32.65-.32 1.48 0 .23-.08.38-.48.38-2 0-4.04-1.25-5.32-3.15-.5-.73-.83-1.6-.83-1.6s-.03-.1-.01-.15c.03-.04.11-.05.11-.05h1.26c.26 0 .38.1.44.25.26.62.64 1.4 1.13 2 .3.37.42.5.54.5.06 0 .1-.04.14-.15.15-.62.06-1.7-.27-2.13-.13-.17-.37-.22-.48-.24-.04-.01-.02-.05.01-.07.15-.1.54-.15 1.01-.15.82 0 1.05.08 1.18.2.35.32.22 1.34.22 1.73 0 .13.02.18.07.2.05.03.11 0 .2-.08.41-.49.77-1.22.95-1.85.06-.2.15-.3.42-.3h1.27c.33 0 .4.1.33.4-.14.63-.82 1.63-1.16 2.1-.15.22-.18.33-.04.47.1.1.43.43.83.91.73.88 1.1 1.45 1.18 1.83z"/>
        </svg>
      </a>
    </div>
  </div>

  <div class="footer__subscribe">
    <p class="footer__subscribe-text">
      Подпишись на наши акции:
    </p>

    <form class="footer__form">
      <div class="footer__form-row">
        <input
          type="email"
          class="footer__form-input"
          id="email"
          name="email"
          placeholder="Введите Email..."
          required
        >

        <button type="submit" class="footer__form-button">
          Подписаться
        </button>
      </div>
    </form>

    <button
      type="button"
      class="footer__registration-button"
      id="registrationButton"
    >
      Регистрация
    </button>
  </div>

  <nav class="footer__nav">
    <h3 class="footer__nav-title">Быстрые ссылки</h3>

    <ul class="footer__nav-list">
      <li>
        <a href="#">Главная</a>
      </li>
      <li>
        <a href="#">Магазин</a>
      </li>
      <li>
        <a href="#">Контакты</a>
      </li>
    </ul>
  </nav>

  <div class="footer__copyright">
    www.product-cards.com@all right reserve
  </div>
</footer>

  <div class="overlay"></div>
  <div class="modal">
    <button class="modal__close" id="closeModalButton">&times;</button>
    <h2 class="modal__title">Регистрация</h2>
    <form class="registration-form">

      <label for="firstName">Имя</label>
      <input
        type="text"
        id="firstName"
        name="firstName"
        placeholder="Введите имя"
        required
      >

      <label for="lastName">Фамилия</label>
      <input
        type="text"
        id="lastName"
        name="lastName"
        placeholder="Введите фамилию"
        required
      >

      <label for="birthDate">Дата рождения</label>
      <input
        type="date"
        id="birthDate"
        name="birthDate"
        required
      >

      <label for="login">Логин</label>
      <input
        type="text"
        id="login"
        name="login"
        placeholder="Введите логин"
        required
      >

      <label for="password">Пароль</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Введите пароль"
        required
        minlength="6"
      >

      <label for="repeatPassword">Повторите пароль</label>
      <input
        type="password"
        id="repeatPassword"
        name="repeatPassword"
        placeholder="Повторите пароль"
        required
        minlength="6"
      >

      <button type="submit">Зарегистрироваться</button>

    </form>
  </div>

  <script src="main.js"></script>
  <script src="homework-7.js"></script>
  <script src="homework-8.js"></script>
  <script type="module" src="./homework-9.js"></script>
  <script type="module" src="./homework-10.js"></script>
  <script type="module" src="./homework-11.js"></script>
</body>

</html>
