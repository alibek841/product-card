<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <h1 class="page__title">Выбери свой продукт</h1>
    <div class="buttons">
      <button id="change_color_btn_card">изменить цвет карточки</button>
      <button id="change_colors_btn_cards_all">изменить цвет всех карточек</button>
      <button id="open_Google">открыть Google</button>
      <button id="output_console_log">вывод консоль лог</button>
      <button id="changeButtonColor">Изменить цвет кнопки</button>
    </div>
  <ul class="cards" id="cards"></ul>

<template id="card-template">
  <li class="cards__item">
    <article class="card">
      <img class="card__image" src="" alt="" width="290">
      <span class="card__category"></span>
      <h2 class="card__title"></h2>
      <p class="card__description"></p>
      <span class="card__subtitle">Состав:</span>
      <ul class="card__compound_list"></ul>
      <div class="card__price_row">
        <span class="card__price_label">Цена</span>
        <span class="card__price_value"></span>
      </div>
    </article>
  </li>
</template>
  
  </main>
  <script src="main.js"></script>
  <script src="homework-7.js"></script>
  <script src="homework-8.js"></script>
  <script type="module" src="./homework-9.js"></script>
  <script type="module" src="./homework-10.js"></script>
</body>
