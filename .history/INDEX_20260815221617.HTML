<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <h1 class="page__title">Выбери свой продукт</h1>
    <div class="buttons">
      <button id="change_color_btn_card">изменить цвет карточки</button>
      <button id="change_colors_btn_cards_all">изменить цвет всех карточек</button>
      <button id="open_Google">открыть Google</button>
      <button id="output_console_log">вывод консоль лог</button>
      <button id="changeButtonColor">Изменить цвет кнопки</button>
    </div>
    <ul class="cards" id="cards"></ul>

    <template id="card-template">
      <li class="cards__item">
        <article class="card">
          <img class="card__image" src="" alt="" width="290">
          <span class="card__category"></span>
          <h2 class="card__title"></h2>
          <p class="card__description"></p>
          <span class="card__subtitle">Состав:</span>
          <ul class="card__compound_list"></ul>
          <div class="card__price_row">
            <span class="card__price_label">Цена</span>
            <span class="card__price_value"></span>
          </div>
        </article>
      </li>
    </template>
  </main>

  <footer class="footer">
  <div class="footer__container">
    
    <div class="footer__info">
      <h2 class="footer__title">Product Cards</h2>
      <p class="footer__description">У Нас Самые Лучшие Продукты Для Кожи!</p>
				<div class="footer__social">
       
    </div>
    </div>

    <div class="footer__subscribe">
      <p class="footer__subscribe-text">Подпишись на наши акции:</p>
    <form class="footer__form">
      <div class="footer__form-row">
        <input
          type="email"
          class="footer__form-input"
          id="email"
          name="email"
          placeholder="Введите Email..."
          required
        >
       <button type="submit" class="footer__form-button">Подписаться</button>
			 <button type="button" class="footer__registration-button" id="registrationButton">Регистрация</button>
			 
      </div>
    </form>
    </div>
    <nav class="footer__nav">
      <h3 class="footer__nav-title">Быстрые ссылки</h3>
      <ul class="footer__nav-list">
        <li>
					<a href="#">Главная</a>
				</li>
        <li>
					<a href="#">Магазин</a>
				</li>
        <li>
					<a href="#">Контакты</a>
				</li>
      </ul>
    </nav>
    </div>

  <div class="footer__copyright">
    www.product-cards.com@all right reserve
  </div>
</footer>

  <div class="overlay"></div>
  <div class="modal">
    <button class="modal__close" id="closeModalButton">&times;</button>
    <h2 class="modal__title">Регистрация</h2>
    <form class="registration-form">

      <label for="firstName">Имя</label>
      <input
        type="text"
        id="firstName"
        name="firstName"
        placeholder="Введите имя"
        required
      >

      <label for="lastName">Фамилия</label>
      <input
        type="text"
        id="lastName"
        name="lastName"
        placeholder="Введите фамилию"
        required
      >

      <label for="birthDate">Дата рождения</label>
      <input
        type="date"
        id="birthDate"
        name="birthDate"
        required
      >

      <label for="login">Логин</label>
      <input
        type="text"
        id="login"
        name="login"
        placeholder="Введите логин"
        required
      >

      <label for="password">Пароль</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Введите пароль"
        required
        minlength="6"
      >

      <label for="repeatPassword">Повторите пароль</label>
      <input
        type="password"
        id="repeatPassword"
        name="repeatPassword"
        placeholder="Повторите пароль"
        required
        minlength="6"
      >

      <button type="submit">Зарегистрироваться</button>

    </form>
  </div>

  <script src="main.js"></script>
  <script src="homework-7.js"></script>
  <script src="homework-8.js"></script>
  <script type="module" src="./homework-9.js"></script>
  <script type="module" src="./homework-10.js"></script>
  <script type="module" src="./homework-11.js"></script>
</body>

</html>
